name: Build APK

on:
  push:
    paths:
      - "main.py"
      - "buildozer.spec"
      - "ocr/**"
      - "solver/**"
      - "assets/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      # Python 3.11: buildozer и python-for-android на 3.12 спотыкаются
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ВАЖНО про gettext и autopoint.
      # Рецепты p4a (liblzma и другие) прогоняют autoreconf, а тот зовёт
      # autopoint. Без пакетов gettext и autopoint сборка падает примерно
      # на шестой минуте с "autoreconf: error: autopoint failed with exit
      # status: 2" — при этом сам buildozer печатает только общее
      # "failed to execute the last command", и причина не видна.
      - name: Системные пакеты для p4a
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin pkg-config \
            gettext autopoint liblzma-dev libbz2-dev patch ccache \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev
          echo "--- инструменты автосборки ---"
          autoconf --version | head -n 1
          automake --version | head -n 1
          autopoint --version | head -n 1
          libtool --version | head -n 1
          java -version 2>&1 | head -n 1

      - name: Кэш buildozer, gradle и NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.cache/pip
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      # Cython 3 ломает рецепты p4a — только ветка ниже 3.
      - name: Установка buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython<3"

      - name: Версии инструментов и требования приложения
        run: |
          python -V
          cython --version
          buildozer --version
          echo "--- requirements из buildozer.spec ---"
          grep -n "requirements" buildozer.spec || true
          echo "--- файлы приложения ---"
          ls -la
          echo "--- assets ---"
          ls -la assets/ || true

      # ГЛАВНАЯ ПРАВКА.
      # Раньше здесь стояло `printf 'y...' | buildozer android debug 2>&1
      # | tee build.log`. Кода возврата у шага при этом не было от
      # buildozer: в цепочке без `pipefail` берётся код последней команды,
      # то есть tee — а он всегда 0. Из-за этого падение buildozer
      # выглядело как успешная сборка (зелёная галочка, 5 минут), а
      # отсутствие APK ловил уже следующий шаг, без причины в логе.
      # Теперь вывод идёт в файл, код берётся у самой buildozer, и хвост
      # лога печатается прямо здесь — причина видна сразу в этом шаге.
      - name: Сборка APK
        run: |
          buildozer -v android debug > build.log 2>&1
          code=$?
          echo "=== код выхода buildozer: $code ==="
          echo "=== последние 250 строк build.log ==="
          tail -n 250 build.log
          exit $code

      - name: Что вообще собралось
        if: always()
        run: |
          echo "--- bin/ ---"
          ls -la bin/ || true
          echo "--- apk вне .buildozer ---"
          find . -name '*.apk' -not -path './.buildozer/*' || true
          echo "--- apk внутри .buildozer ---"
          find .buildozer -name '*.apk' 2>/dev/null | head -n 20 || true

      - name: Проверка, что APK появился
        run: |
          if ! ls bin/*.apk >/dev/null 2>&1; then
            echo "APK не собрался. Причина — в шаге «Сборка APK» выше."
            exit 1
          fi
          ls -la bin/*.apk

      - name: Хвост лога сборки
        if: always()
        run: |
          echo "=== последние 300 строк build.log ==="
          tail -n 300 build.log || echo "build.log не найден"

      # Ищем строки, по которым причина читается сразу. Первыми — рецепты
      # p4a: отсутствующее требование и падение autoreconf дают разный
      # текст, и оба видны здесь.
      - name: Поиск ошибок в логе
        if: always()
        run: |
          grep -n -i -E "autoreconf|autopoint|no valid recipe|does not exist|command failed|traceback|ModuleNotFoundError|not found|unsupported|sdkmanager|licence|license" build.log \
            | head -n 120 || true

      - name: Лог сборки в артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: APK в артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathsnap-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Публикация релиза apk-latest
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MathSnap APK (latest build)
          body: "Сборка APK из main. Офлайн-распознавание на своей CNN, решение на SymPy."
          files: bin/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
