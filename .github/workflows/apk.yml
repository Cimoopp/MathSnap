name: Build APK

on:
  push:
    paths:
      - "main.py"
      - "buildozer.spec"
      - "ocr/**"
      - "solver/**"
      - "history/**"
      - "assets/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      # Python 3.11: buildozer и python-for-android на 3.12 спотыкаются
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системные пакеты для p4a
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev automake

      - name: Кэш buildozer и gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      # Cython 3 ломает рецепты p4a — только ветка ниже 3
      - name: Установка buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython<3"

      - name: Версии инструментов и требования приложения
        run: |
          python -V
          cython --version
          buildozer --version
          echo "--- requirements из buildozer.spec ---"
          grep -n "requirements" buildozer.spec || true
          echo "--- файлы приложения ---"
          ls -la
          echo "--- assets ---"
          ls -la assets/ || true

      # ВАЖНО: без pipefail. Раньше `set -o pipefail` вместе с `yes |`
      # давал "yes: Broken pipe" и прятал настоящую ошибку сборки.
      - name: Сборка APK
        run: |
          printf 'y\ny\ny\ny\ny\n' | buildozer android debug 2>&1 | tee build.log
          echo "код выхода buildozer: ${PIPESTATUS[1]}"

      - name: Проверка, что APK появился
        run: |
          ls -la bin/ || true
          if ! ls bin/*.apk >/dev/null 2>&1; then
            echo "APK не собрался — смотри артефакт build-log и хвост лога ниже."
            exit 1
          fi
          ls -la bin/*.apk

      # Хвост печатается ВСЕГДА, а не только при failure(): если падает
      # предыдущий шаг проверки, сам лог уже успеть напечатать не может.
      - name: Хвост лога сборки
        if: always()
        run: |
          echo "=== последние 250 строк build.log ==="
          tail -n 250 build.log || echo "build.log не найден"

      # Отдельно вытаскиваем строки с настоящими ошибками — так причина
      # видна сразу, без чтения всего лога.
      - name: Поиск ошибок в логе
        if: always()
        run: |
          echo "=== строки с ошибками ==="
          grep -n -i -E "error|traceback|no valid recipe|command failed|not found" build.log \
            | grep -v -i "error_|no errors" | head -n 80 || true

      - name: Лог сборки в артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: APK в артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathsnap-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Публикация релиза apk-latest
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MathSnap APK (latest build)
          body: "Сборка APK из main. Офлайн-распознавание, решение на SymPy."
          files: bin/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
