name: Train OCR model

# Обучение своей модели распознавания символов в облаке.
# Обычный запуск: вручную — Actions → Train OCR model → Run workflow.
# Этот файл трогаем редко: любая правка в нём запускает обучение сама.
# В публичном репозитории минуты Actions не тратятся вовсе.
# Заливка своих фото в data/handwritten/ обучение НЕ запускает.
#
# Данные обучения (train/train.py собирает их сам):
#   HASYv2      — рукописные символы, качает data/download_data.py;
#   MNIST       — рукописные цифры 0..9;
#   EMNIST      — рукописные буквы x, y, l, g;
#   отрисовка   — знаки +, -, =, (, ), ., /, ^, sqrt шрифтом с искажениями;
#   свои фото   — data/handwritten/<класс>/*.png, только в обучение.
#
# Предел примеров на класс — 1200, применяется ко всем источникам сразу,
# редкие классы дополнительно получают вес, обратный частоте.
# Ожидаемый объём: около 25-30 тысяч символов, шагов на эпоху ~200.
# Лимит джобы 355 минут: при входе 32x32 и батче 128 эпоха идёт 1,5-3 мин,
# то есть 60 эпох — это 1,5-3 часа. Ранняя остановка обычно закрывает раньше.
#
# Зависимости лежат в requirements.txt в корне: его требует кэш pip.
# Файл удалять нельзя — setup-python без него падает за секунды.
#
# Что печатается и где читать итоги:
#   1) шаг «Диагностика датасета» — сколько картинок, какие таблицы и колонки;
#   2) шаг «Обучение модели» — источники, сколько символов, шагов на эпоху;
#   3) шаг «Итоги обучения» — точность на тесте, по классам и список путаниц.
# Вывод дублируется в файлы train/out/*.txt и коммитится в репозиторий
# шагом «Сохранить отчёты» — читать их можно прямо на GitHub.
#
# Почему раньше прогоны падали и что закрыто:
#   1) setup-python падал без requirements.txt — файл добавлен;
#   2) битый (недокачанный) архив датасета закреплялся в кэше и ронял
#      каждый следующий прогон — download_data.py проверяет архив,
#      а кэш датасета переведён на ключ hasyv2-v2;
#   3) кэш подготовленных картинок хранил огрызок датасета (обучение
#      проходило за 29 секунд) — ключ переведён на mathsnap-cache-v6,
#      вместе с ним сбрасываются и старые наборы MNIST/EMNIST;
#   4) прогон #8 дал точность 15,94 %, потому что в обучение попало 2598
#      символов, пять классов были пусты, а лучшей оказалась первая эпоха —
#      подключены MNIST, EMNIST и отрисовка знаков, поднят предел на класс,
#      добавлены веса классов и стратифицированное деление.

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Сколько эпох обучать"
        required: false
        default: "60"
      cap:
        description: "Предел примеров на класс"
        required: false
        default: "1200"
  push:
    paths:
      - ".github/workflows/train.yml"
      - "train/**"
      - "data/extra_data.py"
      - "data/render_glyphs.py"

# Два обучения одновременно не запускаем: это экономит минуты аккаунта.
# Новый push не отменяет идущий прогон, а встаёт в очередь за ним.
concurrency:
  group: mathsnap-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    permissions:
      contents: write

    env:
      # Меньше служебного шума в логах, логи компактнее — они тоже лимитированы
      TF_CPP_MIN_LOG_LEVEL: "3"
      # Печать идёт сразу, а не в конце: при срыве по времени лог не теряется
      PYTHONUNBUFFERED: "1"
      # Keras складывает MNIST и EMNIST сюда, и это же кэшируется
      KERAS_HOME: ${{ github.workspace }}/data/keras

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Кэш датасета HASYv2
        uses: actions/cache@v4
        with:
          path: data/hasy
          key: hasyv2-v2

      # Ключ v6: старый кэш мог содержать огрызок датасета,
      # из-за которого обучение завершалось за считанные секунды,
      # а наборы MNIST/EMNIST после смены предела надо пересобрать.
      - name: Кэш подготовленных картинок
        uses: actions/cache@v4
        with:
          path: data/cache
          key: mathsnap-cache-v6

      # MNIST и EMNIST качаются один раз, дальше берутся из этого кэша.
      - name: Кэш MNIST и EMNIST
        uses: actions/cache@v4
        with:
          path: data/keras
          key: keras-datasets-v1

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Датасет рукописных символов
        run: python data/download_data.py --out data/hasy

      # Шрифт нужен отрисовке знаков (=, (, ), ., /, ^, sqrt). В ubuntu-22.04
      # DejaVu обычно уже стоит, поэтому установка идёт «мягко».
      - name: Шрифт для отрисовки знаков
        run: |
          sudo apt-get install -y fonts-dejavu-core 2>/dev/null \
            || (sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core) \
            || echo "[!] Шрифт поставить не удалось — отрисовка пойдёт запасным вариантом"

      # Вывод диагностики сохраняется в файл: он попадёт в репозиторий,
      # и разбирать датасет можно без скачивания логов.
      - name: Диагностика датасета
        if: always()
        run: |
          mkdir -p train/out
          python data/inspect_dataset.py --data data 2>&1 | tee train/out/dataset_diag.txt

      # pipefail нужен, чтобы провал обучения не «съедался» конвейером
      # с tee: прогон остаётся красным, а лог при этом сохраняется.
      - name: Обучение модели
        run: |
          set -o pipefail
          mkdir -p train/out
          python train/train.py \
            --data data \
            --epochs ${{ github.event.inputs.epochs || 60 }} \
            --per-class-cap ${{ github.event.inputs.cap || 1200 }} \
            --patience 12 \
            --batch 128 \
            --out assets/model.tflite \
            --report-dir train/out 2>&1 | tee train/out/train_log.txt

      # Итоги печатаем в лог: артефакты скачивать неудобно, а цифры нужны сразу.
      - name: Итоги обучения
        if: always()
        run: |
          echo "─────── отчёт ───────"
          if [ -f train/out/report.txt ]; then
            cat train/out/report.txt
          else
            echo "Отчёта нет: обучение не дошло до конца."
          fi
          echo "─────── метрики ───────"
          if [ -f train/out/metrics.json ]; then
            cat train/out/metrics.json
          else
            echo "metrics.json нет."
          fi
          echo "─────── модель ───────"
          if [ -f assets/model.tflite ]; then
            ls -l assets/model.tflite
            size=$(stat -c%s assets/model.tflite)
            if [ "$size" -lt 10000 ]; then
              echo "[!] Модель подозрительно маленькая: $size байт"
            fi
          else
            echo "Модели нет: обучение не дошло до сохранения."
          fi

      # Отчёты коммитятся даже при провале обучения: по ним видно,
      # на каком шаге и почему всё сломалось. Логи прогонов живут
      # в Actions ограниченное время, а файл в репозитории остаётся.
      - name: Сохранить отчёты
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f train/out/dataset_diag.txt train/out/train_log.txt \
                     train/out/report.txt train/out/metrics.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Новых отчётов нет — коммит не нужен"
            exit 0
          fi
          git commit -m "auto: отчёты обучения"
          git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
          git push

      - name: Артефакты обучения
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathsnap-model
          if-no-files-found: warn
          path: |
            assets/model.tflite
            train/out/metrics.json
            train/out/report.txt
            train/out/dataset_diag.txt
            train/out/train_log.txt

      # Падение push не должно ронять джобу: модель в любом случае
      # остаётся в артефактах и её можно закоммитить руками.
      - name: Сохранить модель в репозиторий
        if: success()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f assets/model.tflite ]; then
            echo "Модели нет — коммитить нечего"
            exit 0
          fi
          git add assets/model.tflite
          if git diff --cached --quiet; then
            echo "Модель не изменилась — коммит не нужен"
          else
            git commit -m "auto: обновление модели распознавания"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push
          fi
