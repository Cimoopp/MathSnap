name: Build APK

on:
  push:
    paths:
      - "main.py"
      - "buildozer.spec"
      - "ocr/**"
      - "solver/**"
      - "assets/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

# Нужно, чтобы шаг диагностики мог закоммитить хвост лога сборки:
# тогда причину падения видно прямо в репозитории, не открывая прогон.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      # Python 3.11: buildozer и python-for-android на 3.12 спотыкаются
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системные пакеты для p4a
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin pkg-config \
            gettext autopoint liblzma-dev libbz2-dev patch ccache \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev
          echo "--- инструменты автосборки ---"
          autoconf --version | head -n 1
          automake --version | head -n 1
          autopoint --version | head -n 1
          libtool --version | head -n 1
          java -version 2>&1 | head -n 1

      - name: Кэш buildozer, gradle и NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.cache/pip
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      # Cython 3 ломает рецепты p4a — только ветка ниже 3.
      - name: Установка buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython<3"

      - name: Версии инструментов и требования приложения
        run: |
          python -V
          cython --version
          buildozer --version
          echo "--- requirements из buildozer.spec ---"
          grep -n "requirements" buildozer.spec || true
          echo "--- файлы приложения ---"
          ls -la
          echo "--- assets ---"
          ls -la assets/ || true

      # Код возврата берётся у самой buildozer, а не у tee: иначе падение
      # выглядит как успешная сборка. Хвост лога печатается здесь же.
      - name: Сборка APK
        run: |
          buildozer -v android debug > build.log 2>&1
          code=$?
          echo "=== код выхода buildozer: $code ==="
          echo "=== последние 250 строк build.log ==="
          tail -n 250 build.log
          exit $code

      - name: Что вообще собралось
        if: always()
        run: |
          echo "--- bin/ ---"
          ls -la bin/ || true
          echo "--- apk вне .buildozer ---"
          find . -name '*.apk' -not -path './.buildozer/*' || true
          echo "--- apk внутри .buildozer ---"
          find .buildozer -name '*.apk' 2>/dev/null | head -n 20 || true

      - name: Проверка, что APK появился
        run: |
          if ! ls bin/*.apk >/dev/null 2>&1; then
            echo "APK не собрался. Причина — в шаге «Сборка APK» выше."
            exit 1
          fi
          ls -la bin/*.apk

      - name: Хвост лога сборки
        if: always()
        run: |
          echo "=== последние 300 строк build.log ==="
          tail -n 300 build.log || echo "build.log не найден"

      # Ищем строки, по которым причина читается сразу: рецепты p4a,
      # autoreconf, отсутствующие пакеты, падения компиляции.
      - name: Поиск ошибок в логе
        if: always()
        run: |
          grep -n -i -E "autoreconf|autopoint|no valid recipe|does not exist|command failed|traceback|ModuleNotFoundError|not found|unsupported|error:|fatal|sdkmanager|licence|license" build.log \
            | head -n 160 || true

      # ГЛАВНОЕ ДЛЯ ОТЛАДКИ: хвост лога уходит в репозиторий,
      # поэтому причину падения видно без скачивания артефактов.
      # Путь diagnostics/** не входит в paths триггера выше, так что
      # этот коммит не запускает сборку заново.
      - name: Лог сборки в репозиторий
        if: always()
        run: |
          mkdir -p diagnostics
          tail -n 400 build.log > diagnostics/build-log.txt 2>/dev/null \
            || echo "build.log не найден — сборка не дошла до запуска buildozer" > diagnostics/build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/build-log.txt
          git commit -m "chore: лог сборки APK [skip ci]" || echo "нечего коммитить"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push || echo "push не удался: включи Settings → Actions → General → Workflow permissions → Read and write"

      - name: Лог сборки в артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: APK в артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathsnap-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Публикация релиза apk-latest
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MathSnap APK (latest build)
          body: "Сборка APK из main. Офлайн-распознавание на своей CNN, решение на SymPy."
          files: bin/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
