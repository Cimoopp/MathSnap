name: Train OCR model

# Обучение своей модели распознавания символов в облаке.
# Запуск: вручную — Actions → Train OCR model → Run workflow,
# либо push в train/** или в этот файл.
# Заливка своих фото в data/handwritten/ обучение НЕ запускает: минуты
# Actions в приватном репозитории ограничены, поэтому запуск только осознанный.
#
# Режим обучения: вход 32x32, до 400 примеров на класс, готовые картинки
# кэшируются в data/cache. Лимит джобы 355 минут: на 32x32 эпоха проходит
# за 0,6-1,2 мин, то есть 60 эпох — это 36-72 мин, плюс скачивание датасета
# и установка зависимостей. Ранняя остановка обычно закрывает прогон раньше.

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Сколько эпох обучать"
        required: false
        default: "60"
  push:
    paths:
      - "train/**"
      - ".github/workflows/train.yml"

# Два обучения одновременно не запускаем: это экономит минуты аккаунта.
# Новый push не отменяет идущий прогон, а встаёт в очередь за ним.
concurrency:
  group: mathsnap-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    permissions:
      contents: write

    env:
      # Меньше служебного шума в логах, логи компактнее — они тоже лимитированы
      TF_CPP_MIN_LOG_LEVEL: "3"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Кэш датасета HASYv2
        uses: actions/cache@v4
        with:
          path: data/hasy
          key: hasyv2-v1

      - name: Кэш подготовленных картинок
        uses: actions/cache@v4
        with:
          path: data/cache
          key: mathsnap-cache-v2

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install "tensorflow-cpu==2.15.1" pillow numpy

      - name: Датасет рукописных символов
        run: python data/download_data.py --out data/hasy

      - name: Обучение модели
        run: |
          python train/train.py \
            --data data \
            --epochs ${{ github.event.inputs.epochs || 60 }} \
            --per-class-cap 400 \
            --batch 128 \
            --out assets/model.tflite \
            --report-dir train/out

      - name: Артефакты обучения
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathsnap-model
          if-no-files-found: warn
          path: |
            assets/model.tflite
            train/out/metrics.json
            train/out/report.txt

      - name: Сохранить модель в репозиторий
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/model.tflite
          if git diff --cached --quiet; then
            echo "Модель не изменилась — коммит не нужен"
          else
            git commit -m "auto: обновление модели распознавания"
            git push
          fi
